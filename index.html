<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRNMV Garden</title>
  <meta name="description" content="A cozy always-on gardening idle game tended by cats.">
  <meta name="theme-color" content="#1a1423">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235d9b4f'/%3E%3Ccircle cx='8' cy='6' r='4' fill='%23f7cd5d'/%3E%3Crect x='7' y='9' width='2' height='6' fill='%233f6e46'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="screen"></canvas>
    <div id="ui">
      <div id="hud" class="hidden">
        <div id="hud-res" class="panel hud-tl"></div>
        <div id="hud-clock" class="panel hud-tr"></div>
        <div id="hud-tool" class="panel hud-bl"></div>
        <div id="hud-cats" class="panel hud-br"></div>
      </div>
      <div id="toasts"></div>
      <div id="banner" class="panel"></div>
      <div id="modepanel" class="panel"></div>
      <div id="tooltip" class="panel"></div>
      <div id="menus"></div>
      <div id="card"></div>
      <div id="title" class="show"><div class="title-box"><h1>SRNMV Garden</h1><p class="press">Loading...</p></div></div>
      <div id="padtest" class="panel"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
